<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TSAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta name="description" content="AI by Tianshu">
    <link rel="icon" href="/static/images/favicon.png">
    <link rel="stylesheet" href="/static/materialize/css/materialize.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        body {
            overflow: hidden;
            background: #fff;
        }
        .writing-shell {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .writing-top-nav {
            flex-shrink: 0;
            height: 64px !important;
            line-height: 64px !important;
        }
        .writing-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            height: calc(100vh - 64px);
            overflow: hidden;
        }
        #writing-sidebar {
            background: #fafafa;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid #eee;
        }
        #writing-settings {
            background: #fafafa;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #writing-settings {
            border-left: 1px solid #eee;
            padding: 0;
        }
        #writing-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px 0;
        }
        .writing-sidebar-brand {
            height: 64px;
            line-height: 64px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ee6e73;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .writing-empty {
            color: #888;
            font-size: 0.9rem;
            padding: 18px;
            margin: 0;
        }
        .writing-item {
            height: 48px;
            line-height: 48px;
            padding: 0 16px;
            cursor: pointer;
            color: rgba(0, 0, 0, 0.75);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s ease;
        }
        .writing-item:hover {
            background: #f0f0f0;
        }
        .writing-item.active {
            background: #5c6bc0;
            color: #fff;
        }
        .writing-sidebar-actions {
            flex-shrink: 0;
            border-top: 1px solid #eee;
            padding: 14px 12px 18px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .writing-sidebar-actions .btn {
            border-radius: 4px;
        }
        #writing-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            min-width: 0;
        }
        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            position: relative;
        }
        #content-preview {
            padding: 32px 48px;
            max-width: 800px;
            margin: 0 auto;
            font-size: 15px;
            line-height: 1.8;
            color: #333;
        }
        #content-preview h1, #content-preview h2, #content-preview h3 {
            color: #5c6bc0;
            margin-top: 1.5em;
        }
        #content-textarea {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            outline: none;
            padding: 32px 48px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
            resize: none;
            color: #333;
            box-sizing: border-box;
        }
        #content-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #bdbdbd;
            font-size: 15px;
        }
        #content-footer {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 24px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            font-size: 12px;
        }
        #word-count-display { color: #9e9e9e; }
        #footer-actions { display: flex; gap: 8px; }
        .markdown-body img { max-width: 100%; }
        #writing-settings p {
            color: #888;
            width: 100%;
        }
        .settings-title {
            font-size: 13px;
            font-weight: 600;
            color: #5c6bc0;
            padding: 12px 16px 8px;
            border-bottom: 1px solid #e0e0e0;
            letter-spacing: 0.5px;
        }
        #settings-panel {
            flex-grow: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .setting-item {
            padding: 8px 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .setting-item label {
            display: block;
            font-size: 11px;
            color: #9e9e9e;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .setting-input {
            width: 100%;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 13px;
            outline: none;
        }
        .setting-input:focus {
            border-color: #5c6bc0;
        }
        .btn-setting-modal {
            width: 100%;
            text-align: left;
            font-size: 12px;
            color: #5c6bc0;
            padding: 4px 0;
            border: none;
            background: none;
            cursor: pointer;
        }
        .btn-setting-modal:hover { color: #3949ab; }
        .btn-block { width: 100%; display: block; margin-top: 4px; }
        #ai-chat-panel {
            border-top: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 42vh;
            flex-shrink: 0;
            overflow: hidden;
        }
        .ai-chat-header {
            font-size: 12px;
            font-weight: 600;
            color: #5c6bc0;
            padding: 8px 16px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 12px;
            line-height: 1.6;
        }
        .chat-msg {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 95%;
        }
        .chat-msg.user {
            background: #e8eaf6;
            color: #333;
            margin-left: auto;
            text-align: right;
        }
        .chat-msg.assistant {
            background: #f5f5f5;
            color: #333;
        }
        .chat-msg.system-hint {
            background: #e8f5e9;
            color: #388e3c;
            font-style: italic;
            font-size: 11px;
        }
        #chat-input-area {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }
        #chat-input:focus { border-color: #5c6bc0; }
        #btn-chat-send { flex-shrink: 0; }
        #btn-save-settings:disabled, #btn-update-content:disabled {
            background-color: #bdbdbd !important;
            cursor: not-allowed;
            box-shadow: none;
        }
        @media only screen and (min-width: 993px) {
            #slide-out { display: none !important; }
            #writing-sidebar { flex: 0 0 260px; }
        }
        @media only screen and (max-width: 992px) {
            #writing-sidebar { display: none; }
            #writing-settings { display: none; }
            .writing-layout { grid-template-columns: 1fr; }
        }
        @media only screen and (max-width: 600px) {
            .writing-layout { height: calc(100vh - 64px); }
            #writing-main { min-height: 0; }
        }
    </style>
</head>
<body>
<ul id="slide-out" class="sidenav" style="display:flex;flex-direction:column;">
    <li class="brand-logo center" style="flex-shrink:0;">TSAI</li>
    <li style="flex:1;"></li>
    <li style="flex-shrink:0;border-top:1px solid #eee;">
        <div style="display:flex;justify-content:center;gap:8px;padding:14px 12px 20px;">
            <button id="btn-new-writing-nav" class="btn waves-effect waves-light" type="button" style="border-radius:4px;background-color:#e57373e6;">新建写作</button>
            <a class="btn indigo waves-effect waves-light" href="/" style="border-radius:4px;">进入对话</a>
        </div>
    </li>
</ul>
<div id="writing-sidebar">
    <div class="writing-sidebar-brand">TSAI</div>
    <div id="writing-list">
        <p class="writing-empty center-align">还没有写作任务，点击下方按钮新建</p>
    </div>
    <div class="writing-sidebar-actions">
        <button id="btn-new-writing" class="btn waves-effect waves-light" type="button" style="background-color:#e57373e6;">新建写作</button>
        <button id="btn-go-chat" class="btn indigo waves-effect waves-light" type="button">进入对话</button>
    </div>
</div>
<div class="writing-shell">
    <nav class="white z-depth-0 top-nav writing-top-nav">
        <div class="nav-wrapper">
            <a id="sidenav-trigger" href="#" data-target="slide-out" class="sidenav-trigger">
                <i class="material-icons">menu</i>
            </a>
            <ul class="right">
                <li class="name-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18" style="vertical-align: middle; margin-right: 6px; fill: #ee6e73;">
                        <path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0 96 57.3 96 128s57.3 128 128 128zm89.6 32h-11.8c-22.2 10.3-46.9 16-73.8 16s-51.6-5.7-73.8-16h-11.8C64.5 288 0   352.5 0 432v16c0 35.3 28.7 64 64 64h320c35.3 0 64-28.7 64-64v-16c0-79.5-64.5-144-134.4-144z"/>
                    </svg>
                    {{ user }}
                </li>
                <li>
                    <a id="logout-btn" title="退出登录" style="padding: 0 12px 0 0; color: #aaa; cursor: pointer; line-height: 64px;">
                        <i class="material-icons" style="vertical-align: middle; font-size: 20px;">logout</i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="writing-layout">
        <div id="writing-main">
            <div id="content-area">
                <div id="content-preview" class="markdown-body"></div>
                <textarea id="content-textarea" style="display:none"></textarea>
                <div id="content-empty" class="content-empty-hint">
                    {% if task_id %}
                    内容加载中...
                    {% else %}
                    从左侧选择写作任务，或点击「新建写作」开始
                    {% endif %}
                </div>
            </div>
            <div id="content-footer">
                <div id="word-count-display">字数：0</div>
                <div id="footer-actions" style="display:none">
                    <button id="btn-discard" class="btn grey waves-effect waves-light">放弃</button>
                    <button id="btn-save-content" class="btn indigo waves-effect waves-light">保存</button>
                </div>
            </div>
        </div>

        <div id="writing-settings">
            <div id="settings-panel">
                <div class="settings-title">写作设置</div>

                <div class="setting-item">
                    <label>标题</label>
                    <input type="text" id="setting-title" class="browser-default setting-input" placeholder="写作标题">
                </div>

                <div class="setting-item">
                    <label>字数要求</label>
                    <input type="number" id="setting-word-count" class="browser-default setting-input" placeholder="0 表示不限" min="0">
                </div>

                <div class="setting-item">
                    <label>风格要求</label>
                    <button id="btn-style-req" class="btn-setting-modal waves-effect waves-light btn-flat">点击设置风格要求 ›</button>
                </div>

                <div class="setting-item">
                    <label>内容要求</label>
                    <button id="btn-content-req" class="btn-setting-modal waves-effect waves-light btn-flat">点击设置内容要求 ›</button>
                </div>

                <div class="setting-item">
                    <label>内容大纲</label>
                    <button id="btn-outline" class="btn-setting-modal waves-effect waves-light btn-flat">点击设置内容大纲 ›</button>
                </div>

                <div class="setting-item">
                    <label>参考资料</label>
                    <button id="btn-references" class="btn-setting-modal waves-effect waves-light btn-flat">点击选择参考资料 ›</button>
                </div>

                <div class="setting-item">
                    <button id="btn-save-settings" class="btn indigo waves-effect waves-light btn-block" disabled>保存设置</button>
                </div>

                <div class="setting-item">
                    <button id="btn-update-content" class="btn indigo darken-2 waves-effect waves-light btn-block" disabled>更新内容</button>
                </div>
            </div>

            <div id="ai-chat-panel">
                <div class="ai-chat-header">AI 对话</div>
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" class="browser-default" placeholder="输入消息，Enter 发送">
                    <button id="btn-chat-send" class="btn indigo btn-small waves-effect waves-light">发送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-new-writing" class="modal">
    <a href="#!" class="modal-close" style="position:absolute;top:10px;right:16px;font-size:1.4rem;color:#9e9e9e;line-height:1;text-decoration:none;">×</a>
    <div class="modal-content" style="padding-bottom: 10px;">
        <h5>新建写作</h5>
        <form id="form-new-writing">
            <div class="input-field">
                <input id="new-title" type="text" required>
                <label for="new-title">写作标题</label>
            </div>
            <div class="input-field">
                <input id="new-word-count" type="number" min="0">
                <label for="new-word-count">字数要求（0表示不限）</label>
            </div>
            <div class="input-field">
                <input id="new-style" type="text">
                <label for="new-style">风格要求</label>
            </div>
            <div class="input-field">
                <textarea id="new-content-req" class="materialize-textarea"></textarea>
                <label for="new-content-req">内容要求</label>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-red btn-flat">取消</a>
        <a href="#!" id="btn-confirm-new" class="waves-effect waves-green btn-flat">确定</a>
    </div>
</div>

<div id="modal-style-req" class="modal">
    <a href="#!" class="modal-close" style="position:absolute;top:10px;right:16px;font-size:1.4rem;color:#9e9e9e;line-height:1;text-decoration:none;">×</a>
    <div class="modal-content">
        <h5>风格要求</h5>
        <div class="input-field">
            <textarea id="style-req-textarea" class="materialize-textarea" style="min-height:120px" placeholder="描述写作风格，如：正式、学术、轻松幽默、简洁明了等"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-red btn-flat">取消</a>
        <a href="#!" id="btn-save-style" class="waves-effect waves-green btn-flat">确定</a>
    </div>
</div>

<div id="modal-content-req" class="modal">
    <a href="#!" class="modal-close" style="position:absolute;top:10px;right:16px;font-size:1.4rem;color:#9e9e9e;line-height:1;text-decoration:none;">×</a>
    <div class="modal-content">
        <h5>内容要求</h5>
        <div class="input-field">
            <textarea id="content-req-textarea" class="materialize-textarea" style="min-height:150px" placeholder="详细描述内容要求，如主题、重点、受众、结构等"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-red btn-flat">取消</a>
        <a href="#!" id="btn-save-content-req" class="waves-effect waves-green btn-flat">确定</a>
    </div>
</div>

<div id="modal-outline" class="modal" style="width:60%;max-height:80%">
    <a href="#!" class="modal-close" style="position:absolute;top:10px;right:16px;font-size:1.4rem;color:#9e9e9e;line-height:1;text-decoration:none;">×</a>
    <div class="modal-content">
        <h5>内容大纲</h5>
        <p style="font-size:12px;color:#9e9e9e;margin-bottom:8px">可手动编辑，或点击「生成大纲」由 AI 自动生成</p>
        <textarea id="outline-textarea" class="browser-default" style="width:100%;min-height:300px;border:1px solid #e0e0e0;border-radius:4px;padding:10px;font-family:monospace;font-size:13px;resize:vertical"></textarea>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;padding:8px 24px">
        <button id="btn-gen-outline" class="btn indigo waves-effect waves-light">生成大纲</button>
        <div>
            <a href="#!" class="modal-close waves-effect waves-red btn-flat">取消</a>
            <a href="#!" id="btn-save-outline" class="waves-effect waves-green btn-flat">确定</a>
        </div>
    </div>
</div>

<div id="modal-references" class="modal">
    <a href="#!" class="modal-close" style="position:absolute;top:10px;right:16px;font-size:1.4rem;color:#9e9e9e;line-height:1;text-decoration:none;">×</a>
    <div class="modal-content">
        <h5>选择参考资料</h5>
        <p style="font-size:12px;color:#9e9e9e">从你已上传的文件中选择（多选），写作和对话将只检索这些文件</p>
        <div id="references-file-list" style="max-height:300px;overflow-y:auto;margin-top:12px">
            <p style="color:#bdbdbd">加载中...</p>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-red btn-flat">取消</a>
        <a href="#!" id="btn-save-references" class="waves-effect waves-green btn-flat">确定</a>
    </div>
</div>

<script src="/static/js/jquery/jquery-3.6.4.min.js"></script>
<script src="/static/materialize/js/materialize.min.js"></script>
<script src="/static/js/base.js"></script>
<script>
    const TASK_ID = {{ task_id | tojson }};

    function taskIdOf(task) {
        return task.id || task.task_id;
    }

    function escHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let savedSettings = {title: '', word_count: 0, style_req: '', content_req: '', outline: '', reference_files: []};
    let localSettings = {title: '', word_count: 0, style_req: '', content_req: '', outline: '', reference_files: []};
    let settingsDirty = false;
    let contentSaved = true;
    let editorMode = 'view';
    let editorSnapshot = '';
    let currentContent = '';
    let chatSessionId = null;

    function deepEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
    }

    function checkDirty() {
        settingsDirty = !deepEqual(localSettings, savedSettings);
        document.getElementById('btn-save-settings').disabled = !settingsDirty;
        document.getElementById('btn-update-content').disabled = settingsDirty || !localSettings.outline || !TASK_ID;
    }

    function loadSettingsFromTask(task) {
        savedSettings = {
            title: task.title || '',
            word_count: task.word_count || 0,
            style_req: task.style_req || '',
            content_req: task.content_req || '',
            outline: task.outline || '',
            reference_files: task.reference_files || []
        };
        localSettings = Object.assign({}, savedSettings, {reference_files: savedSettings.reference_files.slice()});
        document.getElementById('setting-title').value = localSettings.title;
        document.getElementById('setting-word-count').value = localSettings.word_count || '';
        updateSettingButtonLabels();
        checkDirty();
    }

    function updateSettingButtonLabels() {
        document.getElementById('btn-style-req').textContent =
            localSettings.style_req ? '已设置风格要求 ›（点击修改）' : '点击设置风格要求 ›';
        document.getElementById('btn-content-req').textContent =
            localSettings.content_req ? '已设置内容要求 ›（点击修改）' : '点击设置内容要求 ›';
        document.getElementById('btn-outline').textContent =
            localSettings.outline ? '已有大纲 ›（点击查看/修改）' : '点击设置内容大纲 ›';
        const refCount = localSettings.reference_files.length;
        document.getElementById('btn-references').textContent =
            refCount > 0 ? `已选 ${refCount} 个文件 ›（点击修改）` : '点击选择参考资料 ›';
    }

    async function loadTask(taskId) {
        if (!taskId) return;
        try {
            const r = await fetch(`/writing/tasks/${taskId}`);
            if (!r.ok) return;
            const task = await r.json();
            loadSettingsFromTask(task);
            chatSessionId = task.session_id;

            const cr = await fetch(`/writing/tasks/${taskId}/content`);
            const cd = await cr.json();
            exitEditMode(cd.content || '');

            await loadChatHistory(task.session_id);
        } catch (e) {
            console.error('加载任务失败', e);
        }
    }

    function enterEditMode() {
        if (!TASK_ID || editorMode === 'edit') return;
        editorMode = 'edit';
        editorSnapshot = currentContent;
        const ta = document.getElementById('content-textarea');
        const preview = document.getElementById('content-preview');
        const empty = document.getElementById('content-empty');
        ta.value = currentContent;
        ta.style.display = 'block';
        preview.style.display = 'none';
        empty.style.display = 'none';
        document.getElementById('footer-actions').style.display = 'flex';
        updateWordCount();
        ta.focus();
    }

    function exitEditMode(newContent) {
        editorMode = 'view';
        currentContent = newContent;
        const ta = document.getElementById('content-textarea');
        const preview = document.getElementById('content-preview');
        const empty = document.getElementById('content-empty');
        ta.style.display = 'none';
        document.getElementById('footer-actions').style.display = 'none';
        if (newContent) {
            empty.style.display = 'none';
            preview.style.display = 'block';
            preview.innerHTML = typeof marked !== 'undefined' ? DOMPurify.sanitize(marked.parse(newContent)) : escHtml(newContent);
        } else {
            preview.style.display = 'none';
            empty.style.display = 'flex';
        }
        updateWordCount();
    }

    function updateWordCount() {
        let text = currentContent;
        if (editorMode === 'edit') {
            text = document.getElementById('content-textarea').value;
        }
        const plain = text.replace(/[#*`>\-_\[\]()!]/g, ' ').replace(/\s+/g, ' ').trim();
        const count = plain ? plain.length : 0;
        document.getElementById('word-count-display').textContent = `字数：${count}`;
    }

    function initEditor() {
        document.getElementById('content-preview').addEventListener('click', enterEditMode);
        document.getElementById('content-textarea').addEventListener('input', updateWordCount);
        document.getElementById('btn-discard').addEventListener('click', function() {
            exitEditMode(editorSnapshot);
        });
        document.getElementById('btn-save-content').addEventListener('click', async function() {
            if (!TASK_ID) return;
            const content = document.getElementById('content-textarea').value;
            this.disabled = true;
            this.textContent = '保存中...';
            try {
                const r = await fetch(`/writing/tasks/${TASK_ID}/content`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({content})
                });
                if (!r.ok) throw new Error(await r.text());
                exitEditMode(content);
                M.toast({html:'已保存', classes:'indigo'});
            } catch(e) {
                M.toast({html:'保存失败：' + e.message, classes:'red'});
            } finally {
                this.disabled = false;
                this.textContent = '保存';
            }
        });
    }

    async function loadChatHistory(sessionId) {
        const container = document.getElementById('chat-messages');
        if (!sessionId) {
            container.innerHTML = '';
            return;
        }
        try {
            const r = await fetch(`/messages/${sessionId}`);
            if (!r.ok) return;
            const msgs = await r.json();
            container.innerHTML = '';
            msgs.forEach(m => appendChatMsg(m.role, m.content));
            container.scrollTop = container.scrollHeight;
        } catch(e) {
            console.error('加载对话历史失败', e);
        }
    }

    function appendChatMsg(role, content, isSystemHint) {
        const container = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'chat-msg ' + (isSystemHint ? 'system-hint' : role);
        if (role === 'assistant' && !isSystemHint && typeof marked !== 'undefined') {
            div.innerHTML = DOMPurify.sanitize(marked.parse(content));
        } else {
            div.textContent = content;
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function initChatPanel() {
        const sendBtn = document.getElementById('btn-chat-send');
        const input = document.getElementById('chat-input');

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg || !chatSessionId) return;
            input.value = '';
            appendChatMsg('user', msg);
            sendBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('session_id', chatSessionId);
                formData.append('message', msg);
                if (localSettings.reference_files && localSettings.reference_files.length > 0) {
                    formData.append('source_files', localSettings.reference_files.join(','));
                }
                const r = await fetch('/chat', { method:'POST', body:formData });
                if (!r.ok) throw new Error('请求失败');
                const d = await r.json();
                const answer = d.answer || '';

                const startMark = '[WRITING_UPDATE_START]';
                const endMark = '[WRITING_UPDATE_END]';
                const startIdx = answer.indexOf(startMark);
                const endIdx = answer.indexOf(endMark);

                if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
                    const newContent = answer.slice(startIdx + startMark.length, endIdx).trim();
                    const explanation = answer.slice(endIdx + endMark.length).trim();
                    exitEditMode(newContent);
                    currentContent = newContent;
                    await fetch(`/writing/tasks/${TASK_ID}/content`, {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({content: newContent})
                    });
                    appendChatMsg('assistant', explanation || '✓ 已根据你的指令修改了写作内容');
                    appendChatMsg('', '✓ 写作内容已更新并保存', true);
                } else {
                    appendChatMsg('assistant', answer);
                }
            } catch(e) {
                appendChatMsg('', '发送失败：' + e.message, true);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    }

    function initSettingsListeners() {
        document.getElementById('setting-title').addEventListener('input', function () {
            localSettings.title = this.value;
            checkDirty();
        });
        document.getElementById('setting-word-count').addEventListener('input', function () {
            localSettings.word_count = parseInt(this.value) || 0;
            checkDirty();
        });

        document.getElementById('btn-style-req').addEventListener('click', function () {
            document.getElementById('style-req-textarea').value = localSettings.style_req;
            M.Modal.getInstance(document.getElementById('modal-style-req')).open();
        });
        document.getElementById('btn-save-style').addEventListener('click', function () {
            localSettings.style_req = document.getElementById('style-req-textarea').value.trim();
            updateSettingButtonLabels();
            checkDirty();
            M.Modal.getInstance(document.getElementById('modal-style-req')).close();
        });

        document.getElementById('btn-content-req').addEventListener('click', function () {
            document.getElementById('content-req-textarea').value = localSettings.content_req;
            M.Modal.getInstance(document.getElementById('modal-content-req')).open();
        });
        document.getElementById('btn-save-content-req').addEventListener('click', function () {
            localSettings.content_req = document.getElementById('content-req-textarea').value.trim();
            updateSettingButtonLabels();
            checkDirty();
            M.Modal.getInstance(document.getElementById('modal-content-req')).close();
        });

        document.getElementById('btn-outline').addEventListener('click', function () {
            document.getElementById('outline-textarea').value = localSettings.outline;
            M.Modal.getInstance(document.getElementById('modal-outline')).open();
        });
        document.getElementById('btn-save-outline').addEventListener('click', function () {
            localSettings.outline = document.getElementById('outline-textarea').value.trim();
            updateSettingButtonLabels();
            checkDirty();
            M.Modal.getInstance(document.getElementById('modal-outline')).close();
        });

        document.getElementById('btn-gen-outline').addEventListener('click', async function () {
            if (!TASK_ID) { M.toast({html: '请先选择写作任务'}); return; }
            const btn = this;
            btn.disabled = true;
            btn.textContent = '生成中...';
            const textarea = document.getElementById('outline-textarea');
            textarea.value = '';
            try {
                const resp = await fetch(`/writing/tasks/${TASK_ID}/generate_outline`);
                if (!resp.ok) { throw new Error('请求失败'); }
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finished = false;
                while (!finished) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const chunk = line.slice(6);
                            if (chunk === '[DONE]') { finished = true; break; }
                            textarea.value += chunk;
                        }
                    }
                }
                M.toast({html: '大纲生成完成', classes: 'indigo'});
            } catch (e) {
                M.toast({html: '生成大纲失败：' + e.message, classes: 'red'});
            } finally {
                btn.disabled = false;
                btn.textContent = '生成大纲';
            }
        });

        document.getElementById('btn-references').addEventListener('click', async function () {
            M.Modal.getInstance(document.getElementById('modal-references')).open();
            await loadReferenceFiles();
        });
        document.getElementById('btn-save-references').addEventListener('click', function () {
            const checked = Array.from(
                document.querySelectorAll('#references-file-list input[type=checkbox]:checked')
            ).map(cb => cb.value);
            localSettings.reference_files = checked;
            updateSettingButtonLabels();
            checkDirty();
            M.Modal.getInstance(document.getElementById('modal-references')).close();
        });

        document.getElementById('btn-save-settings').addEventListener('click', async function () {
            if (!TASK_ID) return;
            this.disabled = true;
            this.textContent = '保存中...';
            try {
                const r = await fetch(`/writing/tasks/${TASK_ID}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(localSettings)
                });
                if (!r.ok) throw new Error(await r.text());
                savedSettings = Object.assign({}, localSettings, {reference_files: localSettings.reference_files.slice()});
                settingsDirty = false;
                M.toast({html: '设置已保存', classes: 'indigo'});
                checkDirty();
            } catch (e) {
                M.toast({html: '保存失败：' + e.message, classes: 'red'});
                this.disabled = false;
            } finally {
                this.textContent = '保存设置';
            }
        });

        document.getElementById('btn-update-content').addEventListener('click', async function () {
            if (!TASK_ID) return;
            if (!localSettings.outline) {
                M.toast({html: '请先生成内容大纲', classes: 'orange'});
                return;
            }
            const btn = this;
            btn.disabled = true;
            btn.textContent = '生成中...';
            const preview = document.getElementById('content-preview');
            document.getElementById('content-empty').style.display = 'none';
            document.getElementById('content-textarea').style.display = 'none';
            document.getElementById('footer-actions').style.display = 'none';
            preview.style.display = 'block';
            preview.style.whiteSpace = 'pre-wrap';
            preview.style.fontFamily = 'monospace';
            preview.textContent = '';
            let fullContent = '';
            try {
                const resp = await fetch(`/writing/tasks/${TASK_ID}/generate_content`, {method: 'POST'});
                if (!resp.ok) throw new Error('请求失败');
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finished = false;
                while (!finished) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const chunk = line.slice(6);
                            if (chunk === '[DONE]') { finished = true; break; }
                            fullContent += chunk;
                            preview.textContent += chunk;
                        }
                    }
                }
                preview.style.whiteSpace = '';
                preview.style.fontFamily = '';
                exitEditMode(fullContent);
                const saveResp = await fetch(`/writing/tasks/${TASK_ID}/content`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: fullContent})
                });
                if (!saveResp.ok) throw new Error('内容保存失败');
                contentSaved = true;
                M.toast({html: '内容已生成并保存', classes: 'indigo'});
            } catch (e) {
                M.toast({html: '生成失败：' + e.message, classes: 'red'});
            } finally {
                btn.disabled = false;
                btn.textContent = '更新内容';
                checkDirty();
            }
        });
    }

    async function loadReferenceFiles() {
        const container = document.getElementById('references-file-list');
        container.innerHTML = '<p style="color:#bdbdbd">加载中...</p>';
        try {
            const r = await fetch('/writing/files');
            const d = await r.json();
            if (!d.files || d.files.length === 0) {
                container.innerHTML = '<p style="color:#bdbdbd">暂无已处理的文件</p>';
                return;
            }
            container.innerHTML = d.files.map(f => `
                <label style="display:block;padding:6px 0;cursor:pointer">
                    <input type="checkbox" value="${escHtml(f)}" ${
                        localSettings.reference_files.includes(f) ? 'checked' : ''
                    } style="margin-right:8px">
                    <span style="font-size:13px">${escHtml(f)}</span>
                </label>
            `).join('');
        } catch (e) {
            container.innerHTML = '<p style="color:red">加载失败</p>';
        }
    }

    function renderWritingTasks(tasks) {
        const list = document.getElementById('writing-list');
        list.innerHTML = '';
        if (!tasks || tasks.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'writing-empty center-align';
            empty.textContent = '还没有写作任务，点击下方按钮新建';
            list.appendChild(empty);
            return;
        }
        tasks.forEach((task) => {
            const item = document.createElement('div');
            const id = taskIdOf(task);
            item.className = 'writing-item';
            if (String(id) === String(TASK_ID)) {
                item.classList.add('active');
            }
            item.title = task.title || '未命名写作';
            item.textContent = task.title || '未命名写作';
            item.addEventListener('click', () => {
                window.location.href = `/writing/${id}`;
            });
            list.appendChild(item);
        });
    }

    function loadWritingTasks() {
        $.ajax({
            url: '/writing/tasks',
            method: 'GET',
            success: renderWritingTasks,
            error: function () {
                M.toast({html: '写作任务加载失败'});
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        M.AutoInit();
        M.Modal.init(document.querySelectorAll('#modal-style-req, #modal-content-req, #modal-outline, #modal-references'));
        initSettingsListeners();
        initEditor();
        initChatPanel();
        loadWritingTasks();
        if (TASK_ID) loadTask(TASK_ID);

        const modalElem = document.getElementById('modal-new-writing');
        const modal = M.Modal.getInstance(modalElem) || M.Modal.init(modalElem);

        function openNewWritingModal() {
            modal.open();
            setTimeout(function () {
                document.getElementById('new-title').focus();
            }, 150);
        }
        document.getElementById('btn-new-writing').addEventListener('click', openNewWritingModal);
        document.getElementById('btn-new-writing-nav').addEventListener('click', openNewWritingModal);

        document.getElementById('btn-confirm-new').addEventListener('click', function () {
            const newTitle = document.getElementById('new-title').value.trim();
            if (!newTitle) {
                M.toast({html: '请填写写作标题'});
                return;
            }
            $.ajax({
                url: '/writing/tasks',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({title: newTitle}),
                success: function (resp) {
                    const newTaskId = resp.id || resp.task_id;
                    window.location.href = `/writing/${newTaskId}`;
                },
                error: function () {
                    M.toast({html: '新建写作失败，请稍后重试'});
                }
            });
        });

        document.getElementById('btn-go-chat').addEventListener('click', function () {
            window.location.href = '/';
        });
    });
</script>
